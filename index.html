<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<title>Смены</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{
  /* нейтрали и оттенки — шкалы Radix Colors, ступень 9 для меток */
  --ground:#f9f9fb; --surface:#fcfcfd; --sunk:#e8e8ec;
  --ink:#1c2024; --muted:#60646c; --faint:#8b8d98; --line:#d9d9e0;
  --first:#e93d82; --first-bg:#ffe9f0; --first-fg:#cb1d63;
  --mid:#12a594; --mid-bg:#e0f8f3; --mid-fg:#008573;
  --second:#3e63dd; --second-bg:#edf2fe; --second-fg:#3a5bc7; --accent:#008573;
  --warn:#d13415; --warn-soft:#ffdcd3; --edge:#d9d9e0;
  --shadow:0 1px 2px rgba(28,32,36,.05),0 8px 24px -16px rgba(28,32,36,.22);
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#111113; --surface:#18191b; --sunk:#272a2d;
  --ink:#edeef0; --muted:#b0b4ba; --faint:#696e77; --line:#363a3f;
  --first:#e93d82; --first-bg:#381525; --first-fg:#ff92ad;
  --mid:#0bd8b6; --mid-bg:#0d2d2a; --mid-fg:#0bd8b6;
  --second:#9eb1ff; --second-bg:#182449; --second-fg:#9eb1ff; --accent:#0bd8b6;
  --warn:#ff977d; --warn-soft:#2f1b16; --edge:#363a3f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#111113; --surface:#18191b; --sunk:#272a2d;
  --ink:#edeef0; --muted:#b0b4ba; --faint:#696e77; --line:#363a3f;
  --first:#e93d82; --first-bg:#381525; --first-fg:#ff92ad;
  --mid:#0bd8b6; --mid-bg:#0d2d2a; --mid-fg:#0bd8b6;
  --second:#9eb1ff; --second-bg:#182449; --second-fg:#9eb1ff; --accent:#0bd8b6;
  --warn:#ff977d; --warn-soft:#2f1b16; --edge:#363a3f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1060px;margin:0 auto;padding-inline:16px;padding-block:24px 56px}
h1,h2,h3{font-family:Bitter,Georgia,serif;text-wrap:balance;margin:0}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;font-weight:600}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:baseline;justify-content:space-between;margin-bottom:20px}
.clock{font-family:Bitter,Georgia,serif;font-size:15px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
section{margin-top:28px}

/* ——— сейчас ——— */
.now{padding:20px}
.now-top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-start;justify-content:space-between}
.onair{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.person{display:flex;align-items:center;gap:9px;background:var(--sunk);border-radius:999px;padding:6px 14px 6px 8px}
.person .dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px var(--edge)}
.person b{font-weight:600}
.person small{color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);font-style:italic}
.axis{margin-top:20px;position:relative}
.axis-line{position:relative;min-height:28px}
.axis-grid{position:absolute;top:2px;bottom:2px;width:1px;background:var(--line);opacity:.65}
.axis-fill{position:absolute;top:0;bottom:0;z-index:1;border-radius:3px}
.ticks{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--faint)}
.marker{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:2px;z-index:2}
.marker::after{content:"";position:absolute;left:50%;top:-4px;transform:translateX(-50%);
  width:7px;height:7px;border-radius:50%;background:var(--ink)}

/* ——— переключатели ——— */
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.tabs button{border:0;background:none;font:inherit;font-size:13.5px;font-weight:500;color:var(--muted);
  padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs button:focus-visible,.nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--ink);outline-offset:2px}
.nav{display:flex;align-items:center;gap:8px}
.nav button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;
  width:32px;height:32px;border-radius:8px;cursor:pointer;line-height:1}
.nav button:hover{background:var(--sunk)}
.range{font-weight:600;min-width:11ch;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}

/* ——— расписание ——— */
.scroller{overflow-x:auto}
.day{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center;
  padding:9px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day.weekend .dlabel{color:var(--faint)}
.day.today .dlabel b{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.dlabel{font-size:13px;color:var(--muted);line-height:1.3}
.dlabel b{display:block;font-size:14.5px;font-weight:600;color:var(--ink)}
.track{position:relative;min-height:34px;min-width:340px}
.grid-h{position:absolute;top:2px;bottom:2px;width:1px;background:var(--line);opacity:.65}
.bar-item{position:absolute;border-radius:5px;display:flex;align-items:center;
  border-left:3px solid;
  padding:0 8px;font-size:12px;font-weight:500;letter-spacing:.005em;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
.hours{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);
  margin:6px 0 0 118px;min-width:340px}
.note{font-size:12.5px;color:var(--warn);margin-top:2px}
.draft{font-size:11px;font-weight:600;color:var(--faint);border:1px dashed var(--line);
  border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:1px}

/* ——— месяц ——— */
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:600px}
.month .hd{background:var(--sunk);font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--faint);padding:7px 8px;text-align:center}
.cell{background:var(--surface);min-height:106px;padding:8px 7px 10px;font-size:12px}
.cell.out .n{color:var(--faint);opacity:.6}
.cell .n{font-weight:600;font-size:12.5px;color:var(--muted);margin-bottom:6px;
  width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.cell.today .n{background:var(--accent);color:#fff;border-radius:50%;font-weight:700}
.who{display:block;margin-top:3px;font-size:11px;font-weight:500;line-height:1.5;
  border-radius:4px;border-left:3px solid;padding:1px 5px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ——— правки ——— */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field.wide{grid-column:1/-1}
label{font-size:12px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:62px}
.btn{font:inherit;font-weight:600;font-size:14px;background:var(--ink);color:var(--ground);
  border:0;border-radius:8px;padding:10px 20px;cursor:pointer}
.btn:hover{opacity:.88}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line);padding:5px 12px;font-size:12.5px;font-weight:500}
.msg{font-size:13px;margin-top:10px}
.msg.ok{color:var(--accent)} .msg.bad{color:var(--warn)}
.entries{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.entry{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;
  padding:11px 13px;background:var(--sunk);border-radius:9px;border-left:3px solid var(--line)}
.entry.new{border-left-color:var(--warn)}
.entry.done{border-left-color:var(--accent);opacity:.62}
.entry .kind{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.entry .txt{flex:1 1 220px;min-width:0}
.entry .when{font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px var(--edge)}
.foot{margin-top:34px;font-size:12.5px;color:var(--faint);line-height:1.6}
@media (max-width:640px){
  .day{grid-template-columns:86px 1fr;gap:10px}
  .hours{margin-left:96px}
  h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    <div class="bar">

      <div class="tabs" role="group" aria-label="Вид расписания">

      </div>

    <div class="card pad"><div class="scroller" id="sched"></div></div>
  </section>


  <p class="foot" id="foot"></p>
</div>

function chip(p,sub){
  const s=document.createElement("span"); s.className="person";

  box.appendChild(g);
}
